name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            # Kotlin requires compilation; use a clean manual build so CodeQL
            # observes compiler invocations instead of Gradle cache hits.
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK for Android analysis
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        if: matrix.language == 'java-kotlin'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK components
        if: matrix.language == 'java-kotlin'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.2" \
            "build-tools;36.0.0" \
            "platform-tools"
          test -f "$ANDROID_HOME/platforms/android-37.2/android.jar"

      - name: Set up Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Java and Kotlin without Gradle build cache
        if: matrix.build-mode == 'manual'
        run: |
          # CodeQL must observe the Kotlin compiler. Gradle build-cache hits
          # can restore compile outputs without invoking the compiler.
          ./gradlew --no-daemon --no-build-cache clean assemble

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
