name: Build Cat Browser APK

on:
  workflow_dispatch:
    inputs:
      iceraven_tag:
        description: Iceraven release tag to build (iceraven-x.y.z)
        required: true
        default: iceraven-2.53.0

permissions:
  contents: read

env:
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out this repo
        uses: actions/checkout@v7

      - name: Validate repository scripts
        run: |
          bash -n scripts/cat-branding.sh
          bash -n scripts/test-cat-branding.sh
          bash scripts/test-cat-branding.sh

      - name: Validate Iceraven tag input
        env:
          ICERAVEN_TAG: ${{ inputs.iceraven_tag }}
        run: |
          if [[ ! "$ICERAVEN_TAG" =~ ^iceraven-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Iceraven tag: $ICERAVEN_TAG" >&2
            echo "Expected format: iceraven-x.y.z" >&2
            exit 1
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Clone Iceraven (recursive)
        env:
          ICERAVEN_TAG: ${{ inputs.iceraven_tag }}
        run: |
          git clone --recursive --branch "$ICERAVEN_TAG" https://github.com/fork-maintainers/iceraven-browser.git iceraven
          cd iceraven
          git submodule update --init --recursive

      - name: Install Android SDK (Iceraven script)
        working-directory: iceraven
        run: bash -e automation/iceraven/install-sdk.sh

      - name: Patch Android Components and install Python tools
        working-directory: iceraven
        run: |
          bash -e automation/iceraven/patch_android_components.sh
          bash -e automation/iceraven/setup_venv.sh

      - name: Run Cat Browser branding script
        run: bash scripts/cat-branding.sh "$GITHUB_WORKSPACE/iceraven"

      - name: Enable signing with the debug key
        working-directory: iceraven
        run: echo "autosignReleaseWithDebugKey=" >> local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build forkRelease APK
        working-directory: iceraven
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=4g -Xms1g -Xmx6g -XX:+HeapDumpOnOutOfMemoryError"
        run: ./gradlew :app:assembleForkRelease -PversionName=cat-browser --stacktrace --no-daemon

      - name: Write build metadata and checksums
        env:
          ICERAVEN_TAG: ${{ inputs.iceraven_tag }}
        run: |
          APK_DIR="iceraven/app/build/outputs/apk"
          mapfile -d '' APK_FILES < <(find "$APK_DIR" -type f -name '*.apk' -print0)
          if (( ${#APK_FILES[@]} == 0 )); then
            echo "No APK files were produced in $APK_DIR" >&2
            exit 1
          fi
          {
            echo "Product: Cat Browser"
            echo "Package: io.github.snowgemm.catbrowser"
            echo "Variant: forkRelease"
            echo "Iceraven tag: $ICERAVEN_TAG"
            echo "Iceraven commit: $(git -C iceraven rev-parse HEAD)"
            echo
            echo "APK SHA-256:"
            sha256sum "${APK_FILES[@]}"
          } > cat-browser-build-info.txt

      - name: Upload APKs and build metadata
        uses: actions/upload-artifact@v7
        with:
          name: cat-browser-${{ inputs.iceraven_tag }}
          path: |
            iceraven/app/build/outputs/apk/**/*.apk
            cat-browser-build-info.txt
          if-no-files-found: error
          retention-days: 14
