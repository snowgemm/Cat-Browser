name: Build Cat Browser APK

on:
  workflow_dispatch:
    inputs:
      iceraven_tag:
        description: Iceraven release tag to build
        required: true
        default: iceraven-2.46.0

env:
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Clone Iceraven (recursive)
        env:
          ICERAVEN_TAG: ${{ inputs.iceraven_tag }}
        run: |
          git clone --recursive --branch "$ICERAVEN_TAG" https://github.com/fork-maintainers/iceraven-browser.git iceraven
          cd iceraven
          git submodule update --init --recursive

      - name: Install Android SDK (Iceraven script)
        working-directory: iceraven
        run: bash automation/iceraven/install-sdk.sh

      - name: Patch android-components and setup venv
        working-directory: iceraven
        run: |
          bash automation/iceraven/patch_android_components.sh
          bash automation/iceraven/setup_venv.sh || true

      - name: Run Cat Browser branding script
        run: bash scripts/cat-branding.sh "$GITHUB_WORKSPACE/iceraven"

      - name: Enable signing with the debug key
        working-directory: iceraven
        run: |
          echo "autosignReleaseWithDebugKey=" >> local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build forkRelease APK
        working-directory: iceraven
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=4g -Xms1g -Xmx6g -XX:+HeapDumpOnOutOfMemoryError"
        run: ./gradlew :app:assembleForkRelease -PversionName=cat-browser --stacktrace --no-daemon

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: cat-browser-apk
          path: |
            iceraven/app/build/outputs/apk/**/*.apk
            iceraven/gradle/build/app/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
