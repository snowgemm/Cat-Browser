name: Android Release

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    name: Build and publish signed ABI APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate signing secrets
        env:
          CAT_RELEASE_KEYSTORE_BASE64: ${{ secrets.CAT_RELEASE_KEYSTORE_BASE64 }}
          CAT_RELEASE_STORE_PASSWORD: ${{ secrets.CAT_RELEASE_STORE_PASSWORD }}
          CAT_RELEASE_KEY_ALIAS: ${{ secrets.CAT_RELEASE_KEY_ALIAS }}
          CAT_RELEASE_KEY_PASSWORD: ${{ secrets.CAT_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$CAT_RELEASE_KEYSTORE_BASE64"
          test -n "$CAT_RELEASE_STORE_PASSWORD"
          test -n "$CAT_RELEASE_KEY_ALIAS"
          test -n "$CAT_RELEASE_KEY_PASSWORD"

      - name: Decode release keystore
        env:
          CAT_RELEASE_KEYSTORE_BASE64: ${{ secrets.CAT_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$CAT_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cat-browser-release.jks"
          test -s "$RUNNER_TEMP/cat-browser-release.jks"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.2" \
            "build-tools;36.0.0" \
            "platform-tools"
          test -f "$ANDROID_HOME/platforms/android-37.2/android.jar"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests and build release APKs
        env:
          CAT_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/cat-browser-release.jks
          CAT_RELEASE_STORE_PASSWORD: ${{ secrets.CAT_RELEASE_STORE_PASSWORD }}
          CAT_RELEASE_KEY_ALIAS: ${{ secrets.CAT_RELEASE_KEY_ALIAS }}
          CAT_RELEASE_KEY_PASSWORD: ${{ secrets.CAT_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleRelease

      - name: Validate release APK ABI contents
        run: |
          python3 scripts/verify_abi_apks.py \
            --input app/build/outputs/apk/release \
            --output dist/abi-apks
          for apk in dist/abi-apks/*-debug.apk; do
            mv "$apk" "${apk/-debug.apk/-release.apk}"
          done
          (
            cd dist/abi-apks
            sha256sum *-release.apk > SHA256SUMS
          )

      - name: Verify APK signatures and shared signing identity
        shell: bash
        run: |
          expected_certificate=""
          for apk in dist/abi-apks/*-release.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
            certificate=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            test -n "$certificate"
            if [[ -z "$expected_certificate" ]]; then
              expected_certificate="$certificate"
            elif [[ "$certificate" != "$expected_certificate" ]]; then
              echo "APK signing certificates do not match" >&2
              exit 1
            fi
          done
          echo "All ABI APKs use the same release certificate: $expected_certificate" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release checksums
        run: |
          {
            echo "## Cat Browser $GITHUB_REF_NAME"
            echo
            echo "Production-signed ABI-specific APKs"
            echo
            cat dist/abi-apks/SHA256SUMS
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/abi-apks/*-release.apk \
              dist/abi-apks/SHA256SUMS \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "Cat Browser $GITHUB_REF_NAME"
          else
            if [[ -f ".github/release-notes/$GITHUB_REF_NAME.md" ]]; then
              gh release create "$GITHUB_REF_NAME" \
                dist/abi-apks/*-release.apk \
                dist/abi-apks/SHA256SUMS \
                --title "Cat Browser $GITHUB_REF_NAME" \
                --notes-file ".github/release-notes/$GITHUB_REF_NAME.md"
            else
              gh release create "$GITHUB_REF_NAME" \
                dist/abi-apks/*-release.apk \
                dist/abi-apks/SHA256SUMS \
                --title "Cat Browser $GITHUB_REF_NAME" \
                --generate-notes
            fi
          fi
