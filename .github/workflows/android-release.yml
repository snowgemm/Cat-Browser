name: Android Release

# A tag push is the single release trigger. The workflow itself creates or
# updates the GitHub Release, avoiding a second build from release.published.
on:
  push:
    tags:
      - "v*"

# Serialize retries for the same tag without cancelling an active signed build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: Build and validate signed ABI APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for AI gateway checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Check AI gateway JavaScript
        run: npm run check --prefix ai-gateway

      - name: Test AI gateway request handling
        run: npm test --prefix ai-gateway

      - name: Test APK ABI validation and release notes generator
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Derive Android version from release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          import re
          import sys

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)(?:-beta(?:\.(\d+))?)?", tag)
          if not match:
              sys.exit("Release tags must use vMAJOR.MINOR.PATCH, vMAJOR.MINOR.PATCH-beta, or vMAJOR.MINOR.PATCH-beta.N")

          major, minor, patch = (int(match.group(i)) for i in range(1, 4))
          beta_text = match.group(4)
          is_beta = "-beta" in tag
          stage = int(beta_text) if beta_text else (0 if is_beta else 99)
          if major > 2099 or minor > 99 or patch > 99:
              sys.exit("Version components exceed the supported Android versionCode range")
          if beta_text and not 1 <= stage <= 98:
              sys.exit("Beta sequence must be between 1 and 98")

          version_code = major * 1_000_000 + minor * 10_000 + patch * 100 + stage
          if version_code > 2_100_000_000:
              sys.exit("Generated Android versionCode exceeds the Play/PackageManager limit")

          print("CAT_VERSION_NAME=" + tag.removeprefix("v"))
          print("CAT_VERSION_CODE=" + str(version_code))
          PY

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate signing secrets
        env:
          CAT_RELEASE_KEYSTORE_BASE64: ${{ secrets.CAT_RELEASE_KEYSTORE_BASE64 }}
          CAT_RELEASE_STORE_PASSWORD: ${{ secrets.CAT_RELEASE_STORE_PASSWORD }}
          CAT_RELEASE_KEY_ALIAS: ${{ secrets.CAT_RELEASE_KEY_ALIAS }}
          CAT_RELEASE_KEY_PASSWORD: ${{ secrets.CAT_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$CAT_RELEASE_KEYSTORE_BASE64"
          test -n "$CAT_RELEASE_STORE_PASSWORD"
          test -n "$CAT_RELEASE_KEY_ALIAS"
          test -n "$CAT_RELEASE_KEY_PASSWORD"

      - name: Decode release keystore
        env:
          CAT_RELEASE_KEYSTORE_BASE64: ${{ secrets.CAT_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$CAT_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cat-browser-release.jks"
          test -s "$RUNNER_TEMP/cat-browser-release.jks"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.2" \
            "build-tools;36.0.0" \
            "platform-tools"
          test -f "$ANDROID_HOME/platforms/android-37.2/android.jar"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      # Release tags receive the same source-quality gates as main before signing.
      # Signing secrets are deliberately absent from all test and lint processes.
      - name: Run Android lint, Kotlin lint and unit tests
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:lintDebug \
            :app:ktlintCheck \
            :macrobenchmark:ktlintCheck \
            :app:testDebugUnitTest

      - name: Build signed release APKs
        env:
          CAT_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/cat-browser-release.jks
          CAT_RELEASE_STORE_PASSWORD: ${{ secrets.CAT_RELEASE_STORE_PASSWORD }}
          CAT_RELEASE_KEY_ALIAS: ${{ secrets.CAT_RELEASE_KEY_ALIAS }}
          CAT_RELEASE_KEY_PASSWORD: ${{ secrets.CAT_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Validate release APK ABI contents
        run: |
          python3 scripts/verify_abi_apks.py \
            --input app/build/outputs/apk/release \
            --output dist/abi-apks \
            --variant release
          (
            cd dist/abi-apks
            sha256sum *-release.apk > SHA256SUMS
          )

      - name: Verify APK signatures and shared signing identity
        shell: bash
        run: |
          expected_certificate=""
          for apk in dist/abi-apks/*-release.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
            certificate=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            test -n "$certificate"
            if [[ -z "$expected_certificate" ]]; then
              expected_certificate="$certificate"
            elif [[ "$certificate" != "$expected_certificate" ]]; then
              echo "APK signing certificates do not match" >&2
              exit 1
            fi
          done
          echo "All ABI APKs use the same release certificate: $expected_certificate" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release checksums in workflow summary
        run: |
          {
            echo "## Cat Browser $GITHUB_REF_NAME"
            echo
            echo "Production-signed ABI-specific APKs"
            echo
            cat dist/abi-apks/SHA256SUMS
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          release_notes_file="$RUNNER_TEMP/release-notes.md"
          curated_notes=".github/release-notes/$RELEASE_TAG.md"
          if [[ -f "$curated_notes" ]]; then
            cp "$curated_notes" "$release_notes_file"
          else
            python3 scripts/generate_release_notes.py \
              --tag "$RELEASE_TAG" \
              --repo "$REPOSITORY" \
              --output "$release_notes_file"
          fi
          test -s "$release_notes_file"
          mkdir -p dist/release-assets
          cp dist/abi-apks/*-release.apk dist/release-assets/
          cp dist/abi-apks/SHA256SUMS dist/release-assets/
          cp "$release_notes_file" dist/release-assets/RELEASE_NOTES.md

      # Signed SLSA provenance binds the published binaries to this exact workflow run.
      - name: Attest release APKs and checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/release-assets/*.apk
            dist/release-assets/SHA256SUMS

      - name: Upload validated release assets for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cat-browser-release-assets
          path: dist/release-assets/
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download validated release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cat-browser-release-assets
          path: release-assets

      # Only this small job receives contents:write; build and signing remain read-only.
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_dir="$GITHUB_WORKSPACE/release-assets"
          test -s "$release_dir/RELEASE_NOTES.md"
          test -s "$release_dir/SHA256SUMS"
          compgen -G "$release_dir/*.apk" > /dev/null

          release_assets=( "$release_dir"/*.apk "$release_dir/SHA256SUMS" )
          release_create_flags=()
          release_edit_flags=()
          if [[ "$RELEASE_TAG" == *-beta* ]]; then
            release_create_flags+=(--prerelease)
            release_edit_flags+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${release_assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "Cat Browser $RELEASE_TAG" \
              --notes-file "$release_dir/RELEASE_NOTES.md" \
              "${release_edit_flags[@]}"
          else
            gh release create "$RELEASE_TAG" "${release_assets[@]}" \
              --title "Cat Browser $RELEASE_TAG" \
              --notes-file "$release_dir/RELEASE_NOTES.md" \
              "${release_create_flags[@]}"
          fi
