name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build ABI APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Install the exact Android platform required by GeckoView and Compose.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.2" \
            "build-tools;36.0.0" \
            "platform-tools"
          test -f "$ANDROID_HOME/platforms/android-37.2/android.jar"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests and build ABI-split debug APKs
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Validate APK ABI contents and GeckoView libraries
        run: |
          python3 scripts/verify_abi_apks.py \
            --input app/build/outputs/apk/debug \
            --output dist/abi-apks

      - name: Verify APK signatures
        run: |
          for apk in dist/abi-apks/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          done

      - name: Upload ABI-specific development APKs
        uses: actions/upload-artifact@v7
        with:
          name: cat-browser-abi-debug
          path: dist/abi-apks/*
          if-no-files-found: error
          retention-days: 14
