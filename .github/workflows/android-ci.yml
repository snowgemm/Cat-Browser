name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# New commits supersede older checks on main; avoid spending runners on stale builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build ABI APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js for AI gateway checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Check AI gateway JavaScript
        run: npm run check --prefix ai-gateway

      - name: Test AI gateway request handling
        run: npm test --prefix ai-gateway

      - name: Test APK ABI validation
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.2" \
            "build-tools;36.0.0" \
            "platform-tools"
          test -f "$ANDROID_HOME/platforms/android-37.2/android.jar"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Run Android Lint and Kotlin lint
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug :app:ktlintCheck

      - name: Run unit tests and build ABI-split debug APKs
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Compile physical-device benchmark APKs
        run: ./gradlew --no-daemon --stacktrace :app:assembleBenchmark :macrobenchmark:assembleBenchmark

      - name: Validate APK ABI contents and GeckoView libraries
        run: |
          python3 scripts/verify_abi_apks.py \
            --input app/build/outputs/apk/debug \
            --output dist/abi-apks

      - name: Verify APK signatures
        run: |
          for apk in dist/abi-apks/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          done

      - name: Publish SHA-256 checksums in workflow summary
        run: |
          {
            echo "## Cat Browser ABI APK checksums"
            echo
            echo "The three APKs below are uploaded as separate, unarchived artifacts."
            echo
            echo "SHA-256:"
            cat dist/abi-apks/SHA256SUMS
          } >> "$GITHUB_STEP_SUMMARY"

      # upload-artifact v7 supports archive:false for a single standalone file.
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/abi-apks/cat-browser-arm64-v8a-debug.apk
          archive: false
          retention-days: 14
          if-no-files-found: error

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/abi-apks/cat-browser-armeabi-v7a-debug.apk
          archive: false
          retention-days: 14
          if-no-files-found: error

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/abi-apks/cat-browser-x86_64-debug.apk
          archive: false
          retention-days: 14
          if-no-files-found: error
